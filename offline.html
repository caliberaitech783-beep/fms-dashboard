<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3a5b" />
    <title>CMLL FMS Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7f8;
        color: #17232b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(520px, 100%);
        border: 1px solid #ccd5dc;
        border-radius: 8px;
        background: white;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: #4b5f6c;
        line-height: 1.5;
      }
      button {
        margin-top: 18px;
        border: 1px solid #a8660f;
        border-radius: 6px;
        background: #a8660f;
        color: white;
        padding: 10px 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline</h1>
      <p>The dashboard cannot reach the network right now. Reconnect and retry to load live fleet, fuel, and notification data.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
