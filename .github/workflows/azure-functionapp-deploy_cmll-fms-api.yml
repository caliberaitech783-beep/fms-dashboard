name: Build and deploy Node.js project to Azure Function App - cmll-fms-api

on:
  push:
    branches:
      - azure-functionapp-deploy
  workflow_dispatch:

concurrency:
  group: azure-functionapp-cmll-fms-api
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "."
  NODE_VERSION: "22.x"

jobs:
  build:
    if: github.ref == 'refs/heads/azure-functionapp-deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout API deployment branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and test API
        run: |
          npm ci
          npm test

      - name: Create deployment artifact
        run: zip release.zip ./* -r

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/azure-functionapp-deploy'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: node-app

      - name: Extract deployment artifact
        run: |
          unzip release.zip
          rm release.zip

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D638C37FA2534B1281403CDF82F2D4A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_779F58D8528C4159906E481FDF8E8EDD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E37734F374F045BAAD689AA645BBEAFB }}

      - name: Configure CASE API settings
        env:
          CASE_BASE_URL: ${{ secrets.CASE_BASE_URL }}
          CASE_CUMULATIVE_OPERATING_HOURS_URL: ${{ secrets.CASE_CUMULATIVE_OPERATING_HOURS_URL }}
          CASE_CUMULATIVE_FUEL_USED_URL: ${{ secrets.CASE_CUMULATIVE_FUEL_USED_URL }}
          CASE_CUMULATIVE_IDLE_HOURS_URL: ${{ secrets.CASE_CUMULATIVE_IDLE_HOURS_URL }}
          CASE_ACCESS_TOKEN: ${{ secrets.CASE_ACCESS_TOKEN }}
          CASE_REFRESH_TOKEN: ${{ secrets.CASE_REFRESH_TOKEN }}
          CASE_CLIENT_ID: ${{ secrets.CASE_CLIENT_ID }}
          CASE_CLIENT_SECRET: ${{ secrets.CASE_CLIENT_SECRET }}
          CASE_TOKEN_URL: ${{ secrets.CASE_TOKEN_URL }}
          CASE_AUDIENCE: ${{ secrets.CASE_AUDIENCE }}
          CASE_SUBSCRIPTION_KEY: ${{ secrets.CASE_SUBSCRIPTION_KEY }}
        run: |
          if [ -z "$CASE_BASE_URL" ] || [ -z "$CASE_CUMULATIVE_OPERATING_HOURS_URL" ] || [ -z "$CASE_CUMULATIVE_FUEL_USED_URL" ] || [ -z "$CASE_CUMULATIVE_IDLE_HOURS_URL" ] || [ -z "$CASE_ACCESS_TOKEN" ] || [ -z "$CASE_REFRESH_TOKEN" ] || [ -z "$CASE_CLIENT_ID" ] || [ -z "$CASE_CLIENT_SECRET" ] || [ -z "$CASE_TOKEN_URL" ] || [ -z "$CASE_AUDIENCE" ] || [ -z "$CASE_SUBSCRIPTION_KEY" ]; then
            echo "CASE API secrets are not configured."
            exit 1
          fi

          resource_group="$(az resource list \
            --name cmll-fms-api \
            --resource-type Microsoft.Web/sites \
            --query '[0].resourceGroup' \
            --output tsv)"

          if [ -z "$resource_group" ]; then
            echo "Azure resource group for cmll-fms-api was not found."
            exit 1
          fi

          current_access_token="$(az functionapp config appsettings list \
            --name cmll-fms-api \
            --resource-group "$resource_group" \
            --query "[?name=='CASE_ACCESS_TOKEN'].value | [0]" \
            --output tsv)"
          if [ -n "$current_access_token" ]; then
            CASE_ACCESS_TOKEN="$current_access_token"
          fi
          echo "::add-mask::$CASE_ACCESS_TOKEN"

          current_refresh_token="$(az functionapp config appsettings list \
            --name cmll-fms-api \
            --resource-group "$resource_group" \
            --query "[?name=='CASE_REFRESH_TOKEN'].value | [0]" \
            --output tsv)"
          if [ -n "$current_refresh_token" ]; then
            CASE_REFRESH_TOKEN="$current_refresh_token"
          fi
          echo "::add-mask::$CASE_REFRESH_TOKEN"

          az functionapp config appsettings set \
            --name cmll-fms-api \
            --resource-group "$resource_group" \
            --settings \
              "CASE_BASE_URL=$CASE_BASE_URL" \
              "CASE_CUMULATIVE_OPERATING_HOURS_URL=$CASE_CUMULATIVE_OPERATING_HOURS_URL" \
              "CASE_CUMULATIVE_FUEL_USED_URL=$CASE_CUMULATIVE_FUEL_USED_URL" \
              "CASE_CUMULATIVE_IDLE_HOURS_URL=$CASE_CUMULATIVE_IDLE_HOURS_URL" \
              "CASE_ACCESS_TOKEN=$CASE_ACCESS_TOKEN" \
              "CASE_REFRESH_TOKEN=$CASE_REFRESH_TOKEN" \
              "CASE_CLIENT_ID=$CASE_CLIENT_ID" \
              "CASE_CLIENT_SECRET=$CASE_CLIENT_SECRET" \
              "CASE_TOKEN_URL=$CASE_TOKEN_URL" \
              "CASE_AUDIENCE=$CASE_AUDIENCE" \
              "CASE_SUBSCRIPTION_KEY=$CASE_SUBSCRIPTION_KEY" \
              "CASE_REQUEST_TIMEOUT_MS=20000" \
              "CASE_REQUEST_RETRIES=2" \
              "CASE_CACHE_SECONDS=60" \
              "CASE_REPORT_CACHE_SECONDS=300" \
              "CASE_METRIC_CONCURRENCY=8" \
              "CASE_MAX_METRIC_PAGES=100" \
              "CASE_REPORT_MAX_DAYS=31" \
            --output none

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: cmll-fms-api
          slot-name: Production
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
