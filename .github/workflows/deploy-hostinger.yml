name: Deploy Hostinger Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_SITE_URL: https://fms.cmll.in
      VITE_AUTH_API_BASE_URL: https://cmll-fms-api-783-hgadd9fqfdb5a8hq.centralindia-01.azurewebsites.net/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run validate:pwa
      - run: npm run build

      - name: Retain production rollback artifact
        uses: actions/upload-artifact@v7
        with:
          name: hostinger-dist-${{ github.sha }}
          path: dist
          retention-days: 30

      - name: Publish immutable production files
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init
          git config user.name "CMLL FMS Deployment"
          git config user.email "fms-deploy@users.noreply.github.com"
          git checkout -b hostinger-deploy
          git add -A
          git commit -m "Deploy ${SOURCE_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin hostinger-deploy

      - name: Deploy production files to Hostinger over restricted SFTP
        env:
          HOSTINGER_SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          HOSTINGER_SFTP_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SFTP_KNOWN_HOSTS }}
          HOSTINGER_SFTP_PATH: ${{ secrets.HOSTINGER_SFTP_PATH }}
          HOSTINGER_SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
          HOSTINGER_SFTP_PRIVATE_KEY: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
          HOSTINGER_SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/hostinger_sftp_key"
          known_hosts_file="${RUNNER_TEMP}/hostinger_known_hosts"
          batch_file="${RUNNER_TEMP}/hostinger_sftp_batch"
          trap 'rm -f "${key_file}" "${known_hosts_file}" "${batch_file}"' EXIT

          printf '%s\n' "${HOSTINGER_SFTP_PRIVATE_KEY}" > "${key_file}"
          chmod 600 "${key_file}"
          printf '%s\n' "${HOSTINGER_SFTP_KNOWN_HOSTS}" > "${known_hosts_file}"

          {
            printf 'cd "%s"\n' "${HOSTINGER_SFTP_PATH}"
            find dist -mindepth 1 -type d -printf '%P\n' | sort | while IFS= read -r directory; do
              printf -- '-mkdir "%s"\n' "${directory}"
            done
            printf 'lcd dist\n'
            find dist -type f -printf '%P\n' | sort | while IFS= read -r file; do
              printf 'put "%s" "%s"\n' "${file}" "${file}"
            done
          } > "${batch_file}"

          sftp \
            -b "${batch_file}" \
            -i "${key_file}" \
            -P "${HOSTINGER_SFTP_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${known_hosts_file}" \
            "${HOSTINGER_SFTP_USER}@${HOSTINGER_SFTP_HOST}"
