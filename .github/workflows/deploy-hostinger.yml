name: Deploy Hostinger Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_SITE_URL: https://fms.cmll.in
      VITE_AUTH_API_BASE_URL: https://cmll-fms-api-783-hgadd9fqfdb5a8hq.centralindia-01.azurewebsites.net/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run validate:pwa
      - run: npm run build

      - name: Retain production rollback artifact
        uses: actions/upload-artifact@v7
        with:
          name: hostinger-dist-${{ github.sha }}
          path: dist
          retention-days: 30

      - name: Publish immutable production files
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init
          git config user.name "CMLL FMS Deployment"
          git config user.email "fms-deploy@users.noreply.github.com"
          git checkout -b hostinger-deploy
          git add -A
          git commit -m "Deploy ${SOURCE_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin hostinger-deploy

      - name: Trigger Hostinger pull deployment
        env:
          HOSTINGER_DEPLOY_TOKEN: ${{ secrets.HOSTINGER_DEPLOY_TOKEN }}
          HOSTINGER_DEPLOY_URL: ${{ secrets.HOSTINGER_DEPLOY_URL }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/hostinger-deploy.zip"
          (
            cd dist
            zip --quiet --recurse-paths "${bundle}" .
          )
          curl \
            --fail \
            --max-time 180 \
            --retry 3 \
            --retry-all-errors \
            --show-error \
            --silent \
            --request POST \
            --header "X-Deploy-Token: ${HOSTINGER_DEPLOY_TOKEN}" \
            --header "X-Deploy-Sha: ${SOURCE_SHA}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@${bundle}" \
            "${HOSTINGER_DEPLOY_URL}"
