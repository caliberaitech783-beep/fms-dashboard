name: Release Artifacts

on:
  push:
    tags:
      - "v*"

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:pwa
      - run: npm run build
      - run: zip -r cmll-fms-pwa.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: cmll-fms-pwa
          path: cmll-fms-pwa.zip

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run validate:pwa
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: cmll-fms-windows
          path: src-tauri/target/release/bundle/**

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run validate:pwa
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: cmll-fms-macos
          path: src-tauri/target/release/bundle/**
