name: One-time migrate Azure application state

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE-CMLL-FMS to run the one-time migration
        required: true
        type: string

concurrency:
  group: one-time-azure-state-migration
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    if: >-
      github.ref == 'refs/heads/azure-functionapp-deploy' &&
      inputs.confirmation == 'MIGRATE-CMLL-FMS'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SOURCE_RESOURCE_GROUP: cmll-rg
      SOURCE_FUNCTION_APP: cmll-fms-api
      DESTINATION_RESOURCE_GROUP: cmll-fms-calibera-rg
      DESTINATION_FUNCTION_APP: cmll-fms-api-783
      MIGRATION_CONCURRENCY: "8"
      MIGRATION_BATCH_COUNT: "80"
      MIGRATION_BATCH_BYTES: "2500000"

    steps:
      - name: Checkout API deployment branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install API dependencies
        run: npm ci --omit=dev

      - name: Sign in to the source Azure tenant
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D638C37FA2534B1281403CDF82F2D4A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_779F58D8528C4159906E481FDF8E8EDD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E37734F374F045BAAD689AA645BBEAFB }}

      - name: Read source application settings
        shell: bash
        run: |
          set -euo pipefail
          source_settings="$RUNNER_TEMP/source-app-settings.json"
          az functionapp config appsettings list \
            --name "$SOURCE_FUNCTION_APP" \
            --resource-group "$SOURCE_RESOURCE_GROUP" \
            --output json > "$source_settings"

          source_storage="$(jq -er '.[] | select(.name == "AzureWebJobsStorage") | .value' "$source_settings")"
          echo "::add-mask::$source_storage"
          printf 'SOURCE_CONNECTION_STRING=%s\n' "$source_storage" >> "$GITHUB_ENV"
          printf 'SOURCE_SETTINGS_PATH=%s\n' "$source_settings" >> "$GITHUB_ENV"

      - name: Sign in to the destination Azure tenant
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A2D43B1FDFA0427A91B4128BD4970864 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5A13C6D439A449DCAFDBC77D4DC75AB4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9B3ECC08B4B04DBFB2CFA4155249F5EE }}

      - name: Read destination application settings
        shell: bash
        run: |
          set -euo pipefail
          destination_settings="$RUNNER_TEMP/destination-app-settings.json"
          az functionapp config appsettings list \
            --name "$DESTINATION_FUNCTION_APP" \
            --resource-group "$DESTINATION_RESOURCE_GROUP" \
            --output json > "$destination_settings"

          destination_storage="$(jq -er '.[] | select(.name == "AzureWebJobsStorage") | .value' "$destination_settings")"
          echo "::add-mask::$destination_storage"
          printf 'DESTINATION_CONNECTION_STRING=%s\n' "$destination_storage" >> "$GITHUB_ENV"
          printf 'DESTINATION_SETTINGS_PATH=%s\n' "$destination_settings" >> "$GITHUB_ENV"
          printf 'MIGRATION_REPORT_PATH=%s\n' "$RUNNER_TEMP/table-migration-report.json" >> "$GITHUB_ENV"
          printf 'SETTINGS_REPORT_PATH=%s\n' "$RUNNER_TEMP/settings-migration-report.json" >> "$GITHUB_ENV"

      - name: Stop destination Function App for a consistent migration
        run: >-
          az functionapp stop
          --name "$DESTINATION_FUNCTION_APP"
          --resource-group "$DESTINATION_RESOURCE_GROUP"

      - name: Copy and validate application tables
        run: node scripts/migrate-azure-tables.mjs

      - name: Merge and apply application settings
        shell: bash
        run: |
          set -euo pipefail
          merged_settings="$RUNNER_TEMP/merged-app-settings.json"
          node scripts/merge-azure-app-settings.mjs \
            "$SOURCE_SETTINGS_PATH" \
            "$DESTINATION_SETTINGS_PATH" \
            "$merged_settings" \
            "$SETTINGS_REPORT_PATH"

          az functionapp config appsettings set \
            --name "$DESTINATION_FUNCTION_APP" \
            --resource-group "$DESTINATION_RESOURCE_GROUP" \
            --settings "@$merged_settings" \
            --output none
          rm -f "$merged_settings"

      - name: Start destination Function App
        if: always()
        run: >-
          az functionapp start
          --name "$DESTINATION_FUNCTION_APP"
          --resource-group "$DESTINATION_RESOURCE_GROUP"

      - name: Verify destination API health
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://cmll-fms-api-783-hgadd9fqfdb5a8hq.centralindia-01.azurewebsites.net/api/health"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$health_url" | jq -e '.ok == true' >/dev/null; then
              echo "Destination API health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Destination API health check did not pass in time."
          exit 1

      - name: Upload non-secret validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-state-migration-report
          path: |
            ${{ runner.temp }}/table-migration-report.json
            ${{ runner.temp }}/settings-migration-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove sensitive runner files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/source-app-settings.json" \
            "$RUNNER_TEMP/destination-app-settings.json" \
            "$RUNNER_TEMP/merged-app-settings.json"
